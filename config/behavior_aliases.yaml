# MarsDog Action Executor — Behavior Alias Map
#
# Maps legacy behavior names to their resolved canonical behavior names,
# optionally injecting default parameters. The Planner uses this map
# during goal resolution so that upstream callers can use old names
# without changes.
#
# Fields:
#   resolved_behavior_name  — canonical behavior name in the catalog
#   injected_params         — key-value params injected during resolution
#   alias_reason            — human-readable tag explaining why the alias exists

behavior_aliases:

  # ──────────────────────────────────────────────────────────────────────────
  # Legacy emotion-action behaviors → expression behaviors (with params)
  # ──────────────────────────────────────────────────────────────────────────

  wagTailFast:
    resolved_behavior_name: expressJoy
    injected_params: { level: MID, interaction_mode: interactive }
    alias_reason: legacy_emotion_action_behavior

