    from_postures: [standing, sitting]
    to_posture: ""
    conditions: {}
    description: "Turn head to the side and wipe the mouth area against a foreleg or nearby surface."

  # ── ACT_PAUSE_AND_LOOK_AT_OWNER ────────────────────────────────────────────
