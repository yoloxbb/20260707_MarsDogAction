action_units:
  ACT_RAISE_HEAD:
    unit_id: ACT_RAISE_HEAD
    unit_type: atomic_action
    # 上厕所的完成信号.  Protocol §1.2.3.1: 0x21010130 is the pitch axis and
    # 取正值时低头, so raising the head is the *negative* mirror of the 低头
    # proxies use.  Added 2026-09-18 at the product owner's request as an
    # explicit "this behavior is done" marker.  Both magnitudes are 20000 since
    # 2026-09-18: the pitch axis ignores |value| <= 6553, so the original 7500
    # was 3.6% into the usable stroke and the gesture was invisible on the real
    # dog.  The 2.5 s hold (1.5 s since 2026-09-18's first pass, lengthened
    # again the same day) plus the in-place-mode switch and the settle wait come
    # to ~5 s, and an entry-time posture recovery can add 2.2 s more, so the
    # budget is 10 s rather than 6.
    timeout_sec: 10.0
    interrupt_policy: safe_point
    from_postures:
    - standing
    to_posture: standing
  ACT_TWIST_WAIST_LEFT_RIGHT:
    unit_id: ACT_TWIST_WAIST_LEFT_RIGHT
    unit_type: atomic_action
    # 进食流程的收尾手势: 左右各扭一次腰.  Both halves are the same 偏航 proxy the
    # 114-action family uses (0x21010135 = 10500, 真机上「明显扭转，幅度清晰」),
    # but with opposite signs -- which is exactly why this is its own plan and
    # not a member of that family: the family anchor is byte-identical and
    # single-direction, and the loader forbids a variant.  1.6 s per side
    # matches the family hold.  Budget: two in-place holds (3.2 s), two mode
    # switches (0.2 s), one control period, the entry stand-up recovery a lying
    # dog needs (2.2 s measured) and the settle wait come to ~6 s, so 8.
    timeout_sec: 8.0
    interrupt_policy: safe_point
    from_postures:
    - standing
    to_posture: standing
  ACT_SNIFF_BOWL_AND_WAIT_FOR_FOOD:
    unit_id: ACT_SNIFF_BOWL_AND_WAIT_FOR_FOOD
    unit_type: atomic_action
    timeout_sec: 5.0
    interrupt_policy: safe_point
  ACT_SNIFF_AND_CIRCLE_AT_TOILET_SPOT:
    unit_id: ACT_SNIFF_AND_CIRCLE_AT_TOILET_SPOT
    unit_type: atomic_action
    # 3 laps of the 0.2 m-radius orbit at 1.20 rad/s: 3*2*pi/1.20 = 15.7 s, plus
    # the entry checks, the mode switch and the settle after it.  This is the
    # outer cap, and the backend's twist step is clamped to it, so anything
    # below the orbit duration leaves the dog part-way round the third lap.
    timeout_sec: 60.0
    interrupt_policy: safe_point
  ACT_SQUAT_AND_ELIMINATE:
    unit_id: ACT_SQUAT_AND_ELIMINATE
    unit_type: atomic_action
    timeout_sec: 5.0
    interrupt_policy: non_interruptible
  ACT_SCRATCH_SOIL_OR_GROUND:
    unit_id: ACT_SCRATCH_SOIL_OR_GROUND
    unit_type: atomic_action
    controller: paw
    timeout_sec: 5.0
    interrupt_policy: safe_point
    from_postures:
    - standing
    to_posture: ''
    conditions:
      ground_surface_ok: true
    description: Kick backwards with hind paws to scratch soil or ground after elimination — a territorial marking instinct.
  ACT_SNIFF_EXCREMENT:
    unit_id: ACT_SNIFF_EXCREMENT
    unit_type: atomic_action
    controller: head
    timeout_sec: 5.0
    interrupt_policy: safe_point
    from_postures:
    - standing
    to_posture: ''
    conditions:
      excrement_nearby: true
      max_distance_m: 0.5
    description: Lower nose and sniff excrement to inspect the result of elimination.
  ACT_WALK_AWAY_OR_SHAKE_HEAD:
    unit_id: ACT_WALK_AWAY_OR_SHAKE_HEAD
    unit_type: composite_action
