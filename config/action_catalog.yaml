# MarsDog Action Catalog — Complete YAML Representation
#
# Defines every executable action unit used by the action executor.
# Each unit maps to a controller adapter and carries posture/condition
# constraints that the planner and executor enforce at runtime.
#
# Fields:
#   unit_id            — canonical action identifier (ACT_<CATEGORY>_<DESCRIPTION>)
#   unit_type          — atomic_action | composite_action | task | policy | modifier
#   controller         — motion | posture | head | tail | mouth | paw | vocal | ear |
#                         gimbal | nav | expression | audio | composite | meta
#   timeout_sec        — default maximum duration before automatic abort
#   interrupt_policy   — safe | unsafe | deferred (can only interrupt at stage boundary)
#   from_postures      — list of posture IDs this action can start from
#   to_posture         — expected posture after completion ("" if unchanged)
#   conditions         — constraints dict (battery_min, emotion_level, object_nearby, etc.)
#   description        — human-readable summary of what this action does

action_units:

  # ╔════════════════════════════════════════════════════════════════════════════╗
  # ║  SECTION A: Eating-related actions                                       ║
  # ╚════════════════════════════════════════════════════════════════════════════╝

  # ── ACT_SNIFF_BOWL_EDGE ────────────────────────────────────────────────────
  ACT_SNIFF_BOWL_EDGE:
    unit_id: ACT_SNIFF_BOWL_EDGE
    unit_type: atomic_action
    controller: head
    timeout_sec: 4.0
    interrupt_policy: safe
    from_postures: [standing, sitting, lying]
    to_posture: standing
    conditions: { food_bowl_nearby: true, max_distance_m: 1.5 }
    description: "Lower head to sniff the edge and rim of the food or water bowl."

  # ── ACT_PAW_AT_BOWL ────────────────────────────────────────────────────────
  ACT_PAW_AT_BOWL:
    unit_id: ACT_PAW_AT_BOWL
    unit_type: atomic_action
    controller: paw
    timeout_sec: 3.0
    interrupt_policy: safe
    from_postures: [standing, sitting]
    to_posture: standing
    conditions: { food_bowl_nearby: true, max_distance_m: 0.8 }
    description: "Reach out with one front paw and tap or nudge the food bowl."

  # ── ACT_SIT_OR_LIE_BY_BOWL ─────────────────────────────────────────────────
  ACT_SIT_OR_LIE_BY_BOWL:
    unit_id: ACT_SIT_OR_LIE_BY_BOWL
    unit_type: composite_action
    controller: posture
    timeout_sec: 5.0
    interrupt_policy: safe
    from_postures: [standing, sitting, lying]
    to_posture: lying
    conditions: { food_bowl_nearby: true, max_distance_m: 1.0 }
    description: "Choose between sitting or lying down next to the food bowl and wait."

  # ── ACT_LICK_FOOD ──────────────────────────────────────────────────────────
  ACT_LICK_FOOD:
    unit_id: ACT_LICK_FOOD
    unit_type: atomic_action
    controller: mouth
    timeout_sec: 6.0
    interrupt_policy: unsafe
    from_postures: [standing, sitting]
    to_posture: ""
    conditions: { food_in_bowl: true, max_distance_m: 0.5 }
    description: "Extend tongue to lick food or water from the bowl repeatedly."

  # ── ACT_CHEW_OR_CARRY_FOOD ─────────────────────────────────────────────────
  ACT_CHEW_OR_CARRY_FOOD:
    unit_id: ACT_CHEW_OR_CARRY_FOOD
    unit_type: composite_action
    controller: mouth
    timeout_sec: 8.0
    interrupt_policy: unsafe
    from_postures: [standing, sitting]
    to_posture: standing
    conditions: { food_acquired: true }
    description: "Chew food thoroughly or pick up a large piece and carry it to a safe spot."

  # ── ACT_SCRATCH_FOOD ───────────────────────────────────────────────────────
  ACT_SCRATCH_FOOD:
    unit_id: ACT_SCRATCH_FOOD
    unit_type: atomic_action
    controller: paw
    timeout_sec: 4.0
    interrupt_policy: safe
    from_postures: [standing, sitting]
    to_posture: ""
    conditions: { food_on_ground: true, max_distance_m: 1.0 }
    description: "Use front paws to scratch at food on the ground to break it apart."

  # ── ACT_LICK_LIPS_AND_SWALLOW ──────────────────────────────────────────────
  ACT_LICK_LIPS_AND_SWALLOW:
    unit_id: ACT_LICK_LIPS_AND_SWALLOW
    unit_type: atomic_action
    controller: mouth
    timeout_sec: 2.0
    interrupt_policy: safe
    from_postures: [standing, sitting, lying]
    to_posture: ""
    conditions: {}
    description: "Lick around the mouth and swallow after eating or drinking."

  # ── ACT_TURN_HEAD_AND_WIPE_MOUTH ───────────────────────────────────────────
  ACT_TURN_HEAD_AND_WIPE_MOUTH:
    unit_id: ACT_TURN_HEAD_AND_WIPE_MOUTH
