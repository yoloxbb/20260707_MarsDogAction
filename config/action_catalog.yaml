    timeout_sec: 5.0
    interrupt_policy: safe_point
    to_posture: standing
  ACT_NAV_WALK_RANDOM:
    unit_id: ACT_NAV_WALK_RANDOM
    unit_type: atomic_action
    timeout_sec: 1.0
    interrupt_policy: immediate
    requires_controller: true
    description: Confirm the completed Nav2 move to a random navigable point.
  ACT_NAV_GO_OUT_TO_PLAY:
    unit_id: ACT_NAV_GO_OUT_TO_PLAY
    unit_type: atomic_action
    timeout_sec: 1.0
    interrupt_policy: immediate
    requires_controller: true
    description: Confirm the completed Nav2 move into the configured play region.
  ACT_NAV_GO_HOME:
    unit_id: ACT_NAV_GO_HOME
    unit_type: atomic_action
    timeout_sec: 1.0
    interrupt_policy: immediate
    requires_controller: true
    description: Confirm arrival at the configured home waypoint.
  ACT_INTERACT_APPROACH_OWNER_CLOSER:
    unit_id: ACT_INTERACT_APPROACH_OWNER_CLOSER
    unit_type: task
    timeout_sec: 160.0
    interrupt_policy: immediate
    requires_controller: true
    description: Bind a fresh human track, locate once, and navigate to a safe stand-off distance with Nav2.
  ACT_BASIC_BACK_UP:
    unit_id: ACT_BASIC_BACK_UP
    unit_type: atomic_action
    timeout_sec: 4.0
    interrupt_policy: immediate
    requires_controller: true
    description: Move backward from the current position and stop.
  ACT_CONTROL_HOLD_STANDING:
    unit_id: ACT_CONTROL_HOLD_STANDING
    unit_type: atomic_action
    timeout_sec: 4.0
    interrupt_policy: immediate
    requires_controller: true
    to_posture: standing
    description: Keep the standing posture while commanding zero chassis motion.
  ACT_CONTROL_HOLD_POSITION:
    unit_id: ACT_CONTROL_HOLD_POSITION
    unit_type: atomic_action
    timeout_sec: 6.0
    interrupt_policy: immediate
    requires_controller: true
    description: Preserve the current posture while commanding zero chassis motion.
  ACT_CONTROL_QUIET:
    unit_id: ACT_CONTROL_QUIET
    unit_type: policy
    timeout_sec: 1.0
    interrupt_policy: immediate
    effect:
      complete_stage_without_motion: true
    description: Stop current behavior audio without changing posture or chassis state.
  ACT_BASIC_WAIT:
    unit_id: ACT_BASIC_WAIT
    unit_type: atomic_action
    timeout_sec: 5.0
    interrupt_policy: safe_point
  ACT_INTERACT_APPROACH_OWNER:
    unit_id: ACT_INTERACT_APPROACH_OWNER
    unit_type: task
    timeout_sec: 160.0
    interrupt_policy: immediate
    requires_controller: true
    description: Bind a fresh human track, locate once, and navigate with Nav2.
  ACT_INTERACT_FOLLOW_OWNER:
    unit_id: ACT_INTERACT_FOLLOW_OWNER
    unit_type: atomic_action
    # Used only by bounded legacy Goals. A timeout_sec=0 follow_owner Goal
    # runs until cancellation; controller health checks remain finite.
    timeout_sec: 15.0
    interrupt_policy: immediate
    requires_controller: true
  ACT_INTERACT_GIVE_PAW:
    unit_id: ACT_INTERACT_GIVE_PAW
    unit_type: atomic_action
    # Outer cap for both branches of this plan: the backend waits
    # min(this, the step's completion_timeout_sec).  Measured on the real dog
    # (2026-09-18): the hello branch takes ~8.2 s and the twist-body branch
    # ~20 s, so this has to clear the slower one.
    timeout_sec: 25.0
    interrupt_policy: safe_point
  ACT_INTERACT_HIGH_FIVE:
    unit_id: ACT_INTERACT_HIGH_FIVE
    unit_type: atomic_action
    timeout_sec: 25.0
    interrupt_policy: safe_point
  ACT_TRICK_ROLL_OVER:
    unit_id: ACT_TRICK_ROLL_OVER
    unit_type: atomic_action
    timeout_sec: 5.0
    interrupt_policy: non_interruptible
  ACT_TRICK_SPIN:
    unit_id: ACT_TRICK_SPIN
    unit_type: atomic_action
    timeout_sec: 6.0
    interrupt_policy: non_interruptible
  ACT_INTERACT_RETURN_OWNER:
    unit_id: ACT_INTERACT_RETURN_OWNER
    unit_type: task
    timeout_sec: 160.0
    interrupt_policy: immediate
    requires_controller: true
    description: Bind a fresh human track, locate once, and return with Nav2.
  ACT_OBJECT_DROP:
    unit_id: ACT_OBJECT_DROP
    unit_type: atomic_action
    timeout_sec: 5.0
    interrupt_policy: safe_point
    requires_controller: true
  ACT_TRICK_PLAY_DEAD:
    unit_id: ACT_TRICK_PLAY_DEAD
    unit_type: atomic_action
    timeout_sec: 6.0
    interrupt_policy: safe_point
    to_posture: lying
  ACT_OBJECT_BRING:
    unit_id: ACT_OBJECT_BRING
    unit_type: atomic_action
    timeout_sec: 5.0
    interrupt_policy: safe_point
    requires_controller: true
  ACT_OBJECT_FETCH:
    unit_id: ACT_OBJECT_FETCH
    unit_type: atomic_action
    timeout_sec: 5.0
    interrupt_policy: safe_point
    requires_controller: true
  ACT_SYSTEM_EMERGENCY_STOP:
    unit_id: ACT_SYSTEM_EMERGENCY_STOP
    unit_type: atomic_action
    timeout_sec: 0.0
    interrupt_policy: immediate
  ACT_UWB_RANDOM_ROAM:
    unit_id: ACT_UWB_RANDOM_ROAM
    unit_type: atomic_action
    timeout_sec: 40.0
    interrupt_policy: immediate
    requires_controller: true
