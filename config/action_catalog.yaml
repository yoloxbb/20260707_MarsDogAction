  ACT_CIRCLE_AROUND:
    unit_id: ACT_CIRCLE_AROUND
    unit_type: composite_action
    controller: motion
    # 6.3 s of open-loop turn at 1.0 rad/s, plus the vision-mode switch and the
    # settle that follows it.  This is the outer cap: the backend's twist step
    # gets min(this, the goal budget), so anything near 6.3 s would clip the
    # turn short of a full circle.  Left at 20.0 when the turn was sped up on
    # 2026-09-20: the cap only has to stay above the turn, and tightening it
    # would start clipping the switch/settle overhead instead.
    timeout_sec: 20.0
    interrupt_policy: safe_point
    from_postures:
    - standing
    to_posture: standing
    conditions: {}
    description: Move in rapid circles around a person, object, or open space — excited orbiting behavior.
