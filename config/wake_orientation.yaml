# Dynamic wake-source orientation through Nav2 Spin.
#
# This adapter is created only when both this flag and agv_enabled are true.
# The upstream behavior tree must send wake_angle_deg in base_link.

enabled: true
action_name: /spin
required_frame_id: base_link
server_timeout_sec: 5.0
result_timeout_sec: 15.0
time_allowance_sec: 12.0

# Calibration:
#   relative_ros_deg = direction_sign * (raw_deg - zero_offset_deg)
# Positive ROS yaw is counter-clockwise (left turn).
angle_zero_offset_deg: 0.0
angle_direction_sign: 1.0
angle_deadband_deg: 5.0
