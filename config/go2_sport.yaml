# Go2 专属动作表；不改变 Tree 行为名和 Lite3 实现。
# exact=原生等价动作，composed=协议/导航组合，proxy=用户授权的安全替代动作。
# proxy 仅表示配置中描述的 Go2 指令已执行，不代表原口部/搬运/接触/充电任务完成。
# 禁用翻腾、FrontPounce 和 Scrape；等待时间不代表真实姿态确认。
# min_linear_x=0.25 是当前设备配置；nav2_spin 只认真实 /spin Result。
enabled: false
request_topic: /api/sport/request
publish_rate_hz: 10.0
stop_publish_count: 3
stand_up_wait_sec: 2.5
cmd_vel_bridge:
  enabled: true
  topic: /cmd_vel
  timeout_sec: 0.5
limits:
  max_linear_x: 0.3
  max_linear_y: 0.2
  max_angular_z: 1.2
  min_linear_x: 0.25
controller_route_overrides:
  ACT_INTERACT_APPROACH_OWNER: person_nav_approach
  ACT_INTERACT_APPROACH_OWNER_CLOSER: person_nav_approach
  ACT_INTERACT_RETURN_OWNER: person_nav_approach
spin:
  action_name: /spin
  server_timeout_sec: 5.0
# Go2 专属表达链；保留通用 Tree 行为名、接近目标阶段及 Lite3 模板。
# 平静每次抽取 2~3 个不同动作，随机顺序完整执行。
# 仅用小幅原地姿态、伸展、坐下和趴卧；最后由 finish_behavior 统一起身平衡。
behavior_stage_overrides:
  expressCalmAlone:
    expression:
      selection_policy: random_n
      selection_count: {min: 2, max: 3}
      candidates:
      - {unit_id: ACT_ROAM_LOOK_DOWN_UP}
      - {unit_id: ACT_ROAM_LOWER_HEAD_PAUSE}
      - {unit_id: ACT_ROAM_OBSERVE_PAUSE}
      - {unit_id: ACT_TWIST_WAIST_LEFT_RIGHT}
      - {unit_id: ACT_NUZZLE_BODY}
      - {unit_id: ACT_STRETCH}
      - {unit_id: ACT_BASIC_SIT}
      - {unit_id: ACT_SPLOOT}
  expressCalmWithHuman:
    expression:
      selection_policy: random_n
      selection_count: {min: 2, max: 3}
      candidates:
      - {unit_id: ACT_ROAM_OBSERVE_PAUSE}
      - {unit_id: ACT_NUZZLE_HEAD}
      - {unit_id: ACT_NUZZLE_BODY}
      - {unit_id: ACT_TWIST_WAIST_LEFT_RIGHT}
      - {unit_id: ACT_ROAM_LOWER_HEAD_PAUSE}
      - {unit_id: ACT_STRETCH}
      - {unit_id: ACT_BASIC_SIT}
      - {unit_id: ACT_SLEEP_BY_FEET}
  expressCalmInPlaceWithHuman:
    expression:
      selection_policy: random_n
      selection_count: {min: 2, max: 3}
      candidates:
      - {unit_id: ACT_ROAM_OBSERVE_PAUSE}
      - {unit_id: ACT_NUZZLE_HEAD}
      - {unit_id: ACT_NUZZLE_BODY}
      - {unit_id: ACT_TWIST_WAIST_LEFT_RIGHT}
      - {unit_id: ACT_ROAM_LOWER_HEAD_PAUSE}
      - {unit_id: ACT_STRETCH}
      - {unit_id: ACT_BASIC_SIT}
      - {unit_id: ACT_SLEEP_BY_FEET}
action_sequences:
  ACT_BASIC_SIT:
    fidelity: exact
    description: 原生 Sit 坐下。
    commanded_posture: sitting
    sequence:
    - command: sit
      duration_sec: 2.5
  ACT_BASIC_LIE_DOWN:
    fidelity: exact
    description: 原生 StandDown 趴下。
    commanded_posture: lying
    sequence:
    - command: stand_down
      duration_sec: 2.5
  ACT_BASIC_STAND:
    fidelity: exact
    description: 原生 StandUp 起身。
    commanded_posture: standing
    sequence:
    - command: stand_up
      duration_sec: 2.5
  ACT_BASIC_BACK_UP:
    fidelity: proxy
    description: 后退速度指令持续 1.2 秒；不保证两步或精确距离。
    commanded_posture: standing
    sequence:
    - command: move
      x: -0.25
      y: 0.0
      z: 0.0
      duration_sec: 1.2
  ACT_CONTROL_HOLD_STANDING:
    fidelity: composed
    description: 显式 StandUp 后保持站立。
    commanded_posture: standing
    sequence:
    - command: stand_up
      duration_sec: 2.5
    - command: stop_move
      duration_sec: 0.5
  ACT_CONTROL_HOLD_POSITION:
    fidelity: exact
    description: StopMove 保持当前姿态。
    commanded_posture: ''
    sequence:
    - command: stop_move
      duration_sec: 5.0
  ACT_BASIC_WAIT:
    fidelity: exact
    description: StopMove 等待，不改变当前姿态。
    commanded_posture: ''
    sequence:
    - command: stop_move
      duration_sec: 3.0
  ACT_TRICK_SPIN:
    fidelity: composed
    description: Nav2 Spin 相对旋转 2π；只认关联 Goal 的终态 Result。
    commanded_posture: standing
    timeout_sec: 25.0
    sequence:
    - command: nav2_spin
      turns: 1
      duration_sec: 20.0
  ACT_CIRCLE_AROUND:
    fidelity: composed
    description: 睡前原地转三圈：Nav2 Spin 目标 6π，成功后才继续睡眠。
    commanded_posture: standing
    timeout_sec: 65.0
    sequence:
    - command: nav2_spin
      turns: 3
      duration_sec: 60.0
  ACT_PLAY_BOW:
    fidelity: proxy
    description: 原生 Stretch 作为前身伸展的玩耍邀请代理。
    commanded_posture: standing
    timeout_sec: 7.0
    sequence:
    - command: stretch
      duration_sec: 5.0
  ACT_BONE_DANCE:
    fidelity: exact
    description: 原生 Dance1 舞蹈（1022），等待 8 秒；没有动作完成反馈。
    commanded_posture: standing
    timeout_sec: 10.0
    sequence:
    - command: dance1
      duration_sec: 8.0
  ACT_GETUP_STRETCH:
    fidelity: composed
    description: StandUp 起身后原生 Stretch 伸展。
    commanded_posture: standing
    timeout_sec: 10.0
    sequence:
    - command: stand_up
      duration_sec: 2.5
    - command: stretch
      duration_sec: 5.0
  ACT_GETUP_SIT:
    fidelity: composed
    description: StandUp 起身后 Sit 坐下；最终姿态为坐姿。
    commanded_posture: sitting
    timeout_sec: 6.0
    sequence:
    - command: stand_up
      duration_sec: 2.5
    - command: sit
      duration_sec: 2.5
  ACT_NUZZLE_HEAD:
    fidelity: proxy
    description: 机身抬起并回正的亲昵表达代理，不声称头部接触。
    commanded_posture: standing
    sequence:
    - command: euler
      x: 0.0
      y: -0.12
      z: 0.0
      duration_sec: 0.8
    - command: euler
      x: 0.0
      y: 0.0
      z: 0.0
      duration_sec: 0.3
  ACT_NUZZLE_BODY:
    fidelity: proxy
    description: 小幅身体左右摇摆的亲昵表达代理，不声称接触人。
    commanded_posture: standing
    sequence:
    - command: euler
      x: 0.1
      y: 0.0
      z: 0.0
      duration_sec: 0.8
    - command: euler
      x: -0.1
      y: 0.0
      z: 0.0
      duration_sec: 0.8
    - command: euler
      x: 0.0
      y: 0.0
      z: 0.0
      duration_sec: 0.3
  ACT_SIT_IN_FRONT_OF_OWNER_AND_LOOK_UP:
    fidelity: proxy
    description: 原生 Sit 坐下；不在坐姿执行 Euler，不保证抬头或主人相对位置。
    commanded_posture: sitting
    sequence:
    - command: sit
      duration_sec: 2.5
  ACT_SIT_BY_DOOR_AND_LOOK_BACK_AT_OWNER:
    fidelity: proxy
    description: 原生 Sit 坐下；门边与主人位置必须由上游完成，无独立头部回望。
    commanded_posture: sitting
    sequence:
    - command: sit
      duration_sec: 2.5
  ACT_WAIT_BY_BOWL_OR_TREAT_CABINET:
    fidelity: proxy
    description: 到位后的 StopMove 等待；不自行寻找食盆或柜子。
    commanded_posture: ''
    sequence:
    - command: stop_move
      duration_sec: 3.0
  ACT_TWIST_WAIST_LEFT_RIGHT:
    fidelity: composed
    description: BalanceStand 后 Euler 左右扭动机身，不用 Move 改变整机航向。
    commanded_posture: standing
    sequence:
    - command: euler
      x: 0.0
      y: 0.0
      z: 0.2
      duration_sec: 1.0
    - command: euler
      x: 0.0
      y: 0.0
      z: -0.2
      duration_sec: 1.0
    - command: euler
      x: 0.0
      y: 0.0
      z: 0.0
      duration_sec: 0.3
  ACT_SHAKE_OFF_WATER:
    fidelity: proxy
    description: 小幅机身左右摇动的甩水表达代理。
    commanded_posture: standing
    sequence:
    - command: euler
      x: 0.1
      y: 0.0
      z: 0.0
      duration_sec: 0.3
    - command: euler
      x: -0.1
      y: 0.0
      z: 0.0
      duration_sec: 0.3
    - command: euler
      x: 0.1
      y: 0.0
      z: 0.0
      duration_sec: 0.3
    - command: euler
      x: -0.1
      y: 0.0
      z: 0.0
      duration_sec: 0.3
    - command: euler
      x: 0.0
      y: 0.0
      z: 0.0
      duration_sec: 0.3
  ACT_YAWN:
    fidelity: proxy
    description: 慢速机身伸展代理，无张嘴或面部哈欠。
    commanded_posture: standing
    sequence:
    - command: euler
      x: 0.0
