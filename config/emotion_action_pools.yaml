# Emotion action pools — behavior + level + interaction_mode → candidate ACT_* pool
# Used by expressCalm, expressJoy, expressExcitement, expressAnxiety, expressFear, expressCuriosity

expressCalm:
  LOW:
    solo:
      - {unit_id: ACT_LIE_FLAT_ON_BELLY, weight: 1.0}
      - {unit_id: ACT_LIE_ON_SIDE, weight: 1.0}
      - {unit_id: ACT_STRETCH_LAZILY, weight: 1.0}
      - {unit_id: ACT_LICK_PAWS, weight: 1.0}
      - {unit_id: ACT_YAWN_SLOWLY, weight: 1.0}
    interactive:
      - {unit_id: ACT_LIE_BELLY_UP, weight: 1.0}
      - {unit_id: ACT_WAIT_BY_DOOR, weight: 1.0}
  HIGH:
    solo:
      - {unit_id: ACT_PATROL_SURROUNDINGS_SLOWLY, weight: 1.0}
    interactive:
      - {unit_id: ACT_LIE_ON_SIDE_BESIDE_PERSON, weight: 1.0}
      - {unit_id: ACT_PAW_AT_OWNER, weight: 1.0}

