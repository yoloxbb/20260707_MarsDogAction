# Behavior-tree action contract
#
# This file is the runtime source of truth for behavior names emitted by the
# upstream behavior tree.
#
# Contract:
#   behavior_name -> ordered stages -> one randomly selected ACT_* unit/stage
# The candidate spelling is case-sensitive and is passed through unchanged.

behaviors:
  eatNormally:
    behavior_name: eatNormally
    success_condition: all_required_stages_completed
    stages:
      - stage_id: prepare
        order: 1
        selection_policy: random_one
        required: true
        candidates:
          - {unit_id: ACT_LOWER_HEAD_AND_APPROACH_BOWL}
      - stage_id: eating
        order: 2
        selection_policy: random_one
        required: true
        candidates:
          - {unit_id: ACT_LICK_FOOD}
          - {unit_id: ACT_CHEW_OR_CARRY_FOOD}
          - {unit_id: ACT_SCRATCH_FOOD}
      - stage_id: interaction
        order: 3
        selection_policy: random_one
        required: true
        candidates:
          - {unit_id: ACT_PAUSE_AND_LOOK_AT_OWNER}
          - {unit_id: ACT_CHANGE_POSTURE}
          - {unit_id: ACT_BURP}
      - stage_id: exit
        order: 4
        selection_policy: random_one
        required: true
        candidates:
          - {unit_id: ACT_LICK_LIPS_OR_NOSE}
          - {unit_id: ACT_SHAKE_HEAD}
          - {unit_id: ACT_WALK_AWAY_OR_LIE_DOWN}
          - {unit_id: ACT_SNIFF_GROUND_FOR_CRUMBS}

  seekFood:
