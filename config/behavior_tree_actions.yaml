      # 再低头 → 左右扭腰, 与 eatNormally 完全一致.
      - stage_id: lower_head
        order: 1
        selection_policy: random_one
        required: true
        candidates:
          - {unit_id: ACT_SNIFF_BOWL_AND_WAIT_FOR_FOOD}
      - stage_id: head_up
