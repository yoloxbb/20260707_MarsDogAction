            - {unit_id: ACT_SNIFF_OBJECT, weight: 1.0}
            - {unit_id: ACT_PUSH_OBJECT_WITH_PAW, weight: 0.8}
            - {unit_id: ACT_SCRATCH_OBJECT_GENTLY, weight: 0.7}
            - {unit_id: ACT_TOUCH_OR_CARRY_OBJECT_WITH_MOUTH, weight: 0.7}
            - {unit_id: ACT_NIBBLE_OBJECT, weight: 0.6}
            - {unit_id: ACT_BARK_AT_OBJECT, weight: 0.4}
        conditions: {object_nearby: true}
        success_condition:
