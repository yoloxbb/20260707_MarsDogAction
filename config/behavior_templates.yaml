# MarsDog Action Executor — Behavior Templates
#
# Defines every canonical behavior as a staged pipeline of action candidates.
# Each stage contains candidate unit_ids drawn from action_catalog.yaml.
# The Planner selects one candidate per stage according to selection_policy
# and the Executor runs stages sequentially, respecting loop, skip_on_fail,
# condition_first, and success_condition constraints.
#
# Fields:
#   behavior_name       — canonical behavior identifier
#   description         — human-readable summary
#   stages              — ordered list of stage definitions
#     stage_name        — human-readable stage label
#     stage_type        — prepare | eating | eliminating | groom | sleep_pose |
#                         sleeping | wakeup | recover | recharge | orient |
#                         express | observe | approach | greet | invite |
#                         request | search | interact | explore | inspect |
#                         exit
#     selection_policy  — random_one | random | first | weighted | condition_first
#     required          — true | false (stage must succeed for behavior success)
#     skip_on_fail      — true | false (continue to next stage if this one fails)
#     loop              — optional loop config: {min: N, max: M}
#     fixed             — true | false (stage is mandatory, cannot be skipped)
#     candidates        — list of candidate unit references
#       unit_id         — ACT_* or TASK_* identifier from action_catalog.yaml
#       weight          — selection weight (default 1.0)
#     conditions        — runtime conditions dict for condition_first policy
#     success_condition — dict describing when the stage is considered done

behavior_templates:

  # ╔════════════════════════════════════════════════════════════════════════════╗
  # ║  SECTION 1: Physiological behaviors                                      ║
  # ╚════════════════════════════════════════════════════════════════════════════╝

  # ── eatNormally ───────────────────────────────────────────────────────────
  # Stage pipeline: prepare(eating) → eating → interaction(optional,skipOnFail) → exit
  eatNormally:
    behavior_name: eatNormally
    description: >
      Approach food bowl at a normal pace, eat steadily, optionally interact
      with the owner mid-meal, then wind down and exit.
    stages:
      - stage_name: prepare
        stage_type: prepare
        selection_policy: random_one
        required: true
        skip_on_fail: false
        fixed: false
        candidates:
          - {unit_id: ACT_SNIFF_BOWL_EDGE, weight: 1.0}
          - {unit_id: ACT_PAW_AT_BOWL, weight: 0.8}
          - {unit_id: ACT_SIT_OR_LIE_BY_BOWL, weight: 0.7}
          - {unit_id: ACT_SNIFF_GROUND_FOR_CRUMBS, weight: 0.6}
          - {unit_id: ACT_CHANGE_POSTURE, weight: 0.5}
          - {unit_id: TASK_APPROACH_OBJECT, weight: 1.0}
        conditions: {food_bowl_nearby: true}
        success_condition:
          type: posture_reached
          target_posture: standing
          max_distance_m: 0.5

      - stage_name: eating
        stage_type: eating
        selection_policy: random_one
        required: true
        skip_on_fail: false
        fixed: false
        candidates:
          - {unit_id: ACT_LICK_FOOD, weight: 1.0}
          - {unit_id: ACT_CHEW_OR_CARRY_FOOD, weight: 1.0}
          - {unit_id: ACT_SCRATCH_FOOD, weight: 0.6}
          - {unit_id: ACT_FAST_LICK_AND_SWALLOW, weight: 0.5}
          - {unit_id: ACT_LICK_LIPS_AND_SWALLOW, weight: 0.4}
        conditions: {food_in_bowl: true}
        success_condition:
          type: duration_elapsed_or_food_consumed
          min_duration_sec: 4.0

      - stage_name: interaction
        stage_type: interaction
        selection_policy: random_one
        required: false
        skip_on_fail: true
        fixed: false
        candidates:
          - {unit_id: ACT_PAUSE_AND_LOOK_AT_OWNER, weight: 1.0}
          - {unit_id: ACT_GROWL_WHILE_EATING, weight: 0.3}
          - {unit_id: ACT_LICK_LIPS_OR_NOSE, weight: 0.8}
        conditions: {owner_visible: true}
        success_condition:
          type: action_completed

      - stage_name: exit
        stage_type: exit
        selection_policy: random_one
        required: true
        skip_on_fail: false
        fixed: false
        candidates:
          - {unit_id: ACT_LICK_LIPS_AND_SWALLOW, weight: 1.0}
          - {unit_id: ACT_TURN_HEAD_AND_WIPE_MOUTH, weight: 0.9}
          - {unit_id: ACT_BURP, weight: 0.4}
          - {unit_id: ACT_LICK_LIPS_OR_NOSE, weight: 0.8}
          - {unit_id: ACT_SHAKE_HEAD, weight: 0.7}
          - {unit_id: ACT_WALK_AWAY_OR_LIE_DOWN, weight: 0.6}
        conditions: {}
        success_condition:
          type: action_completed

  # ── eatExcitedly ──────────────────────────────────────────────────────────
  # Stage pipeline: prepare(fixed) → eating(fixed) → exit(fixed)
  eatExcitedly:
    behavior_name: eatExcitedly
    description: >
      Rush to food with high energy, eat rapidly and intensely, then exit quickly.
      All stages are fixed (mandatory, cannot be skipped or reordered).
    stages:
      - stage_name: prepare
        stage_type: prepare
        selection_policy: random_one
        required: true
        skip_on_fail: false
        fixed: true
        candidates:
          - {unit_id: ACT_CHASE_ROLLING_FOOD, weight: 1.0}
          - {unit_id: ACT_SNIFF_BOWL_EDGE, weight: 0.9}
          - {unit_id: ACT_PAW_AT_BOWL, weight: 0.8}
          - {unit_id: TASK_APPROACH_OBJECT, weight: 1.0}
        conditions: {food_bowl_nearby: true}
        success_condition:
          type: posture_reached
          target_posture: standing
          max_distance_m: 0.3

      - stage_name: eating
        stage_type: eating
        selection_policy: random_one
        required: true
        skip_on_fail: false
        fixed: true
        candidates:
          - {unit_id: ACT_FAST_LICK_AND_SWALLOW, weight: 1.0}
          - {unit_id: ACT_CHEW_OR_CARRY_FOOD, weight: 0.9}
          - {unit_id: ACT_LICK_FOOD, weight: 0.8}
          - {unit_id: ACT_GROWL_WHILE_EATING, weight: 0.5}
          - {unit_id: ACT_SCRATCH_FOOD, weight: 0.6}
        conditions: {food_in_bowl: true}
        success_condition:
          type: duration_elapsed_or_food_consumed
          min_duration_sec: 3.0

      - stage_name: exit
        stage_type: exit
        selection_policy: random_one
        required: true
        skip_on_fail: false
        fixed: true
        candidates:
          - {unit_id: ACT_LICK_LIPS_AND_SWALLOW, weight: 1.0}
          - {unit_id: ACT_BURP, weight: 0.6}
          - {unit_id: ACT_SHAKE_HEAD, weight: 0.7}
          - {unit_id: ACT_TURN_HEAD_AND_WIPE_MOUTH, weight: 0.8}
        conditions: {}
        success_condition:
          type: action_completed

  # ── defecate ──────────────────────────────────────────────────────────────
  # Stage pipeline: prepare → eliminating → exit
  defecate:
    behavior_name: defecate
    description: >
      Find a suitable elimination spot, perform elimination, then clean up and exit.
    stages:
      - stage_name: prepare
        stage_type: prepare
        selection_policy: random_one
        required: true
        skip_on_fail: false
        fixed: false
        candidates:
          - {unit_id: ACT_SNIFF_AND_CIRCLE, weight: 1.0}
          - {unit_id: ACT_SCRATCH_GROUND, weight: 0.8}
          - {unit_id: ACT_HESITATE, weight: 0.6}
          - {unit_id: ACT_LOWER_HEAD_OR_TURN, weight: 0.5}
        conditions: {ground_surface_ok: true}
        success_condition:
          type: posture_reached
          target_posture: squatting

      - stage_name: eliminating
        stage_type: eliminating
        selection_policy: random_one
        required: true
        skip_on_fail: false
        fixed: false
        candidates:
          - {unit_id: ACT_SQUAT_TO_PEE, weight: 0.8}
          - {unit_id: ACT_SQUAT_TO_POOP, weight: 1.0}
          - {unit_id: ACT_TENSE_BODY, weight: 0.9}
          - {unit_id: ACT_SLIGHT_TREMOR, weight: 0.7}
          - {unit_id: ACT_TAIL_MOVEMENT, weight: 0.6}
        conditions: {elimination_ready: true}
        success_condition:
          type: elimination_completed

      - stage_name: exit
        stage_type: exit
        selection_policy: random_one
        required: true
        skip_on_fail: false
        fixed: false
        candidates:
          - {unit_id: ACT_STAND_UP_WITH_HIND_LEGS, weight: 1.0}
          - {unit_id: ACT_SCRATCH_SOIL_OR_GROUND, weight: 0.8}
          - {unit_id: ACT_SNIFF_EXCREMENT, weight: 0.6}
          - {unit_id: ACT_WALK_AWAY_OR_SHAKE_HEAD, weight: 0.9}
        conditions: {}
        success_condition:
          type: posture_reached
          target_posture: standing

  # ── cleanSelf ─────────────────────────────────────────────────────────────
  # Stage pipeline: groom (single stage)
  cleanSelf:
    behavior_name: cleanSelf
    description: >
      Perform self-grooming: lick paws and fur, scratch ears, shake off debris.
      Single contiguous grooming stage.
    stages:
      - stage_name: groom
        stage_type: groom
        selection_policy: random_one
        required: true
        skip_on_fail: false
        fixed: false
        candidates:
          - {unit_id: ACT_LICK_PAWS_OR_FUR, weight: 1.0}
          - {unit_id: ACT_SCRATCH, weight: 0.9}
          - {unit_id: ACT_SHAKE_OFF_WATER, weight: 0.5}
          - {unit_id: ACT_STRETCH_LAZILY, weight: 0.4}
          - {unit_id: ACT_ROLL_OVER, weight: 0.3}
          - {unit_id: ACT_RUB_AGAINST_OBJECT, weight: 0.4}
        conditions: {}
        success_condition:
          type: min_duration_elapsed
          min_duration_sec: 3.0

  # ── sleepNow ──────────────────────────────────────────────────────────────
  # Stage pipeline (shallow): prepare → sleep_pose → sleeping(loop,0-3) → wakeup
  # Stage pipeline (deep):    prepare → sleep_pose → sleeping(loop,0-2) → wakeup
  # sleep_depth is a runtime param injected by the Planner.
  sleepNow:
    behavior_name: sleepNow
    description: >
      Transition into a sleep state. Supports two depth variants:
        shallow — lighter sleep, shorter cycles, more dreaming activity
        deep    — heavier sleep, longer cycles, minimal movement
      Runtime param 'sleep_depth' selects the variant.
    stages:
      - stage_name: prepare
        stage_type: prepare
        selection_policy: random_one
        required: true
        skip_on_fail: false
        fixed: false
        candidates:
          - {unit_id: ACT_CIRCLE_AROUND, weight: 1.0}
          - {unit_id: ACT_SCRATCH_BED_OR_GROUND, weight: 0.8}
          - {unit_id: ACT_LIE_ON_SIDE_AND_STRETCH, weight: 0.7}
          - {unit_id: ACT_LICK_FUR_OR_PAWS, weight: 0.6}
        conditions: {flat_surface: true}
        success_condition:
          type: posture_reached
          target_posture: lying

      - stage_name: sleep_pose
        stage_type: sleep_pose
        selection_policy: random_one
        required: true
        skip_on_fail: false
        fixed: false
        candidates:
          - {unit_id: ACT_SLEEP_CURLED_UP, weight: 1.0}
          - {unit_id: ACT_SLEEP_ON_STOMACH, weight: 0.9}
          - {unit_id: ACT_SLEEP_ON_SIDE_CURLED_UP, weight: 0.8}
          - {unit_id: ACT_SLEEP_ON_SIDE, weight: 0.7}
          - {unit_id: ACT_SLEEP_ON_BACK, weight: 0.4}
        conditions: {flat_surface: true}
        success_condition:
          type: posture_held
          min_duration_sec: 2.0

      - stage_name: sleeping
        stage_type: sleeping
        selection_policy: random_one
        required: true
        skip_on_fail: false
        fixed: false
        loop:
          shallow: {min: 0, max: 3}
          deep: {min: 0, max: 2}
        candidates:
          shallow:
            - {unit_id: ACT_FLIP_BODY, weight: 0.5}
            - {unit_id: ACT_WHINE_SOFTLY, weight: 0.4}
            - {unit_id: ACT_TWITCH_OR_KICK_LEGS, weight: 0.6}
            - {unit_id: ACT_SHAKE_HEAD_OR_SMACK_LIPS, weight: 0.5}
            - {unit_id: ACT_WAG_TAIL, weight: 0.3}
          deep:
            - {unit_id: ACT_SLEEP_ON_SIDE, weight: 1.0}
            - {unit_id: ACT_SLEEP_CURLED_UP, weight: 0.9}
            - {unit_id: ACT_SLEEP_ON_BACK, weight: 0.5}
            - {unit_id: ACT_SLEEP_ON_STOMACH, weight: 0.7}
        conditions: {flat_surface: true}
        success_condition:
          type: sleep_cycle_completed
          min_duration_sec: 5.0

      - stage_name: wakeup
        stage_type: wakeup
        selection_policy: random_one
        required: true
        skip_on_fail: false
        fixed: false
        candidates:
          - {unit_id: ACT_YAWN, weight: 1.0}
          - {unit_id: ACT_GETUP_CRAWL, weight: 0.6}
          - {unit_id: ACT_GETUP_ROLL, weight: 0.5}
          - {unit_id: ACT_GETUP_BOUNCE, weight: 0.4}
          - {unit_id: ACT_GETUP_STRETCH, weight: 0.8}
          - {unit_id: ACT_GETUP_SIT, weight: 0.7}
          - {unit_id: ACT_SHAKE_HEAD, weight: 0.5}
        conditions: {}
        success_condition:
          type: posture_reached
          target_posture: standing

  # ── restInPlace ───────────────────────────────────────────────────────────
  # Stage pipeline: recover (single stage)
  restInPlace:
    behavior_name: restInPlace
    description: >
      Rest and recover energy in place. Single stage selecting low-power
      actions to conserve battery and cool down.
    stages:
      - stage_name: recover
        stage_type: recover
        selection_policy: random_one
        required: true
        skip_on_fail: false
        fixed: false
        candidates:
          - {unit_id: ACT_PANT_IN_PLACE, weight: 0.7}
          - {unit_id: ACT_SLOW_MOVEMENT, weight: 0.5}
          - {unit_id: ACT_LIE_ON_SIDE_AND_STRETCH, weight: 0.6}
          - {unit_id: ACT_YAWN, weight: 0.4}
          - {unit_id: ACT_WAG_TAIL, weight: 0.3}
          - {unit_id: ACT_LIE_BY_DOOR, weight: 0.3}
        conditions: {}
        success_condition:
          type: min_duration_elapsed
          min_duration_sec: 5.0

  # ── recharge ──────────────────────────────────────────────────────────────
  # Stage pipeline: recharge(condition_first:
  #   charger_known → ACT_RETURN_TO_CHARGER,
  #   charger_unavailable → ACT_BARK_AND_LIE_DOWN_IF_NO_CHARGER)
  recharge:
    behavior_name: recharge
    description: >
      Handle low-battery situation. If the charger location is known,
      navigate back and dock. If not, bark for help and conserve power.
      Uses condition_first policy to route to the appropriate action.
    stages:
      - stage_name: recharge
        stage_type: recharge
        selection_policy: condition_first
        required: true
        skip_on_fail: false
        fixed: false
        candidates:
          - unit_id: ACT_RETURN_TO_CHARGER
            weight: 1.0
            conditions: {charger_location_known: true, battery_low: true}
          - unit_id: ACT_BARK_AND_LIE_DOWN_IF_NO_CHARGER
            weight: 1.0
            conditions: {charger_location_unknown: true, battery_low: true}
        conditions: {battery_low: true}
        success_condition:
          type: charging_or_resting
          min_duration_sec: 10.0

  # ╔════════════════════════════════════════════════════════════════════════════╗
  # ║  SECTION 2: Animal social behaviors                                      ║
  # ╚════════════════════════════════════════════════════════════════════════════╝

  # ── testAnimalBoundary ────────────────────────────────────────────────────
  # Stage pipeline: orient(fixed) → express → observe(opt,skipOnFail,fixed)
  testAnimalBoundary:
    behavior_name: testAnimalBoundary
    description: >
      Approach another animal cautiously: orient toward them, express a
      social signal, then observe their response before committing further.
    stages:
      - stage_name: orient
        stage_type: orient
        selection_policy: random_one
        required: true
        skip_on_fail: false
        fixed: true
        candidates:
          - {unit_id: TASK_ORIENT_TO_ANIMAL, weight: 1.0}
          - {unit_id: ACT_STARE_AND_TILT_HEAD, weight: 0.8}
          - {unit_id: ACT_APPROACH_SLOWLY_SIDEWAYS, weight: 0.7}
        conditions: {other_animal_detected: true}
        success_condition:
          type: orientation_achieved
          target_bearing_deg: 15

      - stage_name: express
        stage_type: express
        selection_policy: random_one
        required: true
        skip_on_fail: false
        fixed: false
        candidates:
          - {unit_id: ACT_LOWER_HEAD_FLOP_EARS_WAG_TAIL, weight: 1.0}
          - {unit_id: ACT_BARK_OR_HOWL, weight: 0.5}
          - {unit_id: ACT_SNIFF_FACE_OR_EARS, weight: 0.6}
          - {unit_id: ACT_SNIFF_BUTT_OR_TAIL, weight: 0.6}
        conditions: {other_animal_nearby: true}
        success_condition:
          type: action_completed

      - stage_name: observe
        stage_type: observe
        selection_policy: random_one
        required: false
        skip_on_fail: true
        fixed: true
        candidates:
          - {unit_id: TASK_OBSERVE_ANIMAL_RESPONSE, weight: 1.0}
          - {unit_id: ACT_STARE_AND_TILT_HEAD, weight: 0.7}
        conditions: {other_animal_detected: true}
        success_condition:
          type: observation_completed
          min_duration_sec: 2.0

  # ── greetAnimal ───────────────────────────────────────────────────────────
  # Stage pipeline: approach(fixed) → greet
  greetAnimal:
    behavior_name: greetAnimal
    description: >
      Approach another animal and perform standard canine greeting rituals:
      sniffing, gentle nose touches, and friendly body language.
    stages:
      - stage_name: approach
        stage_type: approach
        selection_policy: random_one
        required: true
        skip_on_fail: false
        fixed: true
        candidates:
          - {unit_id: TASK_APPROACH_ANIMAL_SAFELY, weight: 1.0}
          - {unit_id: ACT_APPROACH_SLOWLY_SIDEWAYS, weight: 0.8}
        conditions: {other_animal_detected: true, safe_to_approach: true}
        success_condition:
          type: distance_reached
          max_distance_m: 0.3

      - stage_name: greet
        stage_type: greet
        selection_policy: random_one
        required: true
        skip_on_fail: false
        fixed: false
        candidates:
          - {unit_id: ACT_SNIFF_FACE_OR_EARS, weight: 1.0}
          - {unit_id: ACT_SNIFF_BUTT_OR_TAIL, weight: 1.0}
          - {unit_id: ACT_TOUCH_NOSE_OR_HEAD_GENTLY, weight: 0.9}
          - {unit_id: ACT_LOWER_HEAD_FLOP_EARS_WAG_TAIL, weight: 0.8}
          - {unit_id: ACT_LIE_BESIDE_OTHER_ANIMAL, weight: 0.5}
        conditions: {other_animal_nearby: true}
        success_condition:
          type: action_completed

  # ── inviteAnimalToPlay ────────────────────────────────────────────────────
  # Stage pipeline: orient(fixed) → invite
  inviteAnimalToPlay:
    behavior_name: inviteAnimalToPlay
    description: >
      Orient toward another animal, then issue a play invitation using
      bows, gentle paws, or playful vocalizations.
    stages:
      - stage_name: orient
        stage_type: orient
        selection_policy: random_one
        required: true
        skip_on_fail: false
        fixed: true
        candidates:
          - {unit_id: TASK_ORIENT_TO_ANIMAL, weight: 1.0}
          - {unit_id: ACT_APPROACH_SLOWLY_SIDEWAYS, weight: 0.6}
        conditions: {other_animal_detected: true}
        success_condition:
          type: orientation_achieved
          target_bearing_deg: 15

      - stage_name: invite
        stage_type: invite
        selection_policy: random_one
        required: true
        skip_on_fail: false
        fixed: false
        candidates:
          - {unit_id: ACT_PLAY_BOW, weight: 1.0}
          - {unit_id: ACT_POUNCE_GENTLY, weight: 0.8}
          - {unit_id: ACT_RUN_IN_CIRCLES_OR_CHASE, weight: 0.7}
          - {unit_id: ACT_PAW_GENTLY_AT_OTHER, weight: 0.8}
          - {unit_id: ACT_CARRY_AND_SHAKE_OBJECT, weight: 0.5}
        conditions: {playmate_nearby: true}
        success_condition:
          type: action_completed

  # ╔════════════════════════════════════════════════════════════════════════════╗
  # ║  SECTION 3: Human interaction behaviors                                  ║
  # ╚════════════════════════════════════════════════════════════════════════════╝

  # ── requestResourceFromHuman ──────────────────────────────────────────────
  # Stage pipeline: request (single stage)
  requestResourceFromHuman:
    behavior_name: requestResourceFromHuman
    description: >
      Request a resource (food, water, toy, walk) from a human using a
      repertoire of attention-seeking and demand behaviors.
    stages:
      - stage_name: request
        stage_type: request
        selection_policy: random_one
        required: true
        skip_on_fail: false
        fixed: false
        candidates:
          - {unit_id: ACT_STARE_AT_FOOD_IN_HAND, weight: 1.0}
          - {unit_id: ACT_SCRATCH_FOOD_BOWL_OR_SNACK_CABINET, weight: 0.8}
          - {unit_id: ACT_CARRY_LEASH_OR_SHOE, weight: 0.7}
          - {unit_id: ACT_PRESS_BELL_OR_TRIGGER_MECHANISM, weight: 0.6}
          - {unit_id: ACT_WHINE_OR_BARK_SOFTLY, weight: 0.7}
          - {unit_id: ACT_PAW_AT_ARM_OR_PANTS, weight: 0.8}
          - {unit_id: ACT_NUDGE_HAND_WITH_HEAD, weight: 0.7}
          - {unit_id: ACT_GUARD_FOOD_BOWL_OR_SNACK_CABINET, weight: 0.4}
        conditions: {human_visible: true}
        success_condition:
          type: action_completed

  # ── seekHumanInteraction ──────────────────────────────────────────────────
  # Stage pipeline: search(opt,condition_first) → approach(opt,condition_first) → interact
  seekHumanInteraction:
    behavior_name: seekHumanInteraction
    description: >
      Seek out a human for social interaction. If a human is not visible,
      search for them. Once found, approach and engage with affectionate or
      playful behaviors.
    stages:
      - stage_name: search
        stage_type: search
        selection_policy: condition_first
        required: false
        skip_on_fail: true
        fixed: false
        candidates:
          - unit_id: ACT_SEARCH_FOR_PERSON
            weight: 1.0
            conditions: {person_visible: false, person_to_find: true}
          - unit_id: ACT_FOLLOW_AND_CLING
            weight: 0.6
            conditions: {person_visible: true}
        conditions: {}
        success_condition:
          type: person_found

      - stage_name: approach
        stage_type: approach
        selection_policy: condition_first
        required: false
        skip_on_fail: true
        fixed: false
        candidates:
          - unit_id: TASK_APPROACH_PERSON
            weight: 1.0
            conditions: {person_detected: true, distance_to_person_gt: 0.5}
          - unit_id: ACT_RUB_AGAINST_LEG_OR_LEAN
            weight: 0.7
            conditions: {person_nearby: true}
        conditions: {}
        success_condition:
          type: distance_reached
          max_distance_m: 0.3

      - stage_name: interact
        stage_type: interact
        selection_policy: random_one
        required: true
        skip_on_fail: false
        fixed: false
        candidates:
          - {unit_id: ACT_NUDGE_HAND_WITH_HEAD, weight: 1.0}
          - {unit_id: ACT_SIT_OR_LIE_AT_FEET, weight: 0.9}
          - {unit_id: ACT_LICK_HAND_OR_FACE, weight: 0.8}
          - {unit_id: ACT_RUB_AGAINST_LEG_OR_LEAN, weight: 0.8}
          - {unit_id: ACT_WHINE_OR_BARK_SOFTLY, weight: 0.6}
          - {unit_id: ACT_PAW_AT_ARM_OR_PANTS, weight: 0.7}
          - {unit_id: ACT_JUMP_ON_PERSON, weight: 0.4}
          - {unit_id: ACT_FOLLOW_AND_CLING, weight: 0.5}
        conditions: {person_nearby: true}
        success_condition:
          type: action_completed

  # ── inviteHumanToPlay ─────────────────────────────────────────────────────
  # Stage pipeline: approach(opt,fixed) → invite
  inviteHumanToPlay:
    behavior_name: inviteHumanToPlay
    description: >
      Invite a human to play. Optionally approach first if not already
      near, then issue a clear play invitation using bows, toy offerings,
      or playful gestures.
    stages:
      - stage_name: approach
        stage_type: approach
        selection_policy: random_one
        required: false
        skip_on_fail: true
        fixed: true
        candidates:
          - {unit_id: TASK_APPROACH_PERSON, weight: 1.0}
          - {unit_id: ACT_FOLLOW_AND_CLING, weight: 0.5}
        conditions: {person_detected: true, distance_to_person_gt: 0.5}
        success_condition:
          type: distance_reached
          max_distance_m: 0.5

      - stage_name: invite
        stage_type: invite
        selection_policy: random_one
        required: true
        skip_on_fail: false
        fixed: false
        candidates:
          - {unit_id: ACT_PLAY_BOW_INVITE, weight: 1.0}
          - {unit_id: ACT_DROP_TOY_IN_FRONT_OF_OWNER, weight: 0.8}
          - {unit_id: ACT_SHAKE_TOY_WITH_MOUTH, weight: 0.6}
          - {unit_id: ACT_RUN_IN_CIRCLES_OR_ZOOMIES, weight: 0.5}
          - {unit_id: ACT_NIP_GENTLY_AT_PANTS_OR_HAND, weight: 0.4}
          - {unit_id: ACT_PLACE_PAW_ON_KNEE, weight: 0.7}
          - {unit_id: ACT_PAW_AT_ARM_OR_PANTS, weight: 0.6}
        conditions: {playmate_nearby: true}
        success_condition:
          type: action_completed

