# ═══════════════════════════════════════════════════════════════════════════════
# Runtime parameter reference
# ═══════════════════════════════════════════════════════════════════════════════
#
# The following runtime parameters are injected by the Planner or passed
# via the BehaviorGoal and influence stage/action selection:
#
#   sleep_depth          — "shallow" or "deep" (sleepNow)
#   level                — "LOW" | "MID" | "HIGH" (emotion expression behaviors)
#   interaction_mode     — "solo" or "interactive" (emotion expression behaviors)
#   object_category      — "slippers_socks" | "trash_can" | "delivery_box" |
#                          "tissue" | "door" | "food_bowl" | "toy" | "generic"
#                          (inspectKnownObject)
#
# Selection policies:
#   random_one           — pick one candidate uniformly at random
#   random               — pick one candidate uniformly at random (alias)
#   first                — always pick the first candidate
#   weighted             — pick one candidate using weight values
#   condition_first      — evaluate conditions in order; select the first
#                           candidate whose conditions are satisfied
#
# Stage modifiers:
#   fixed                — stage is mandatory and non-skippable
#   required             — stage must succeed for behavior success
#   skip_on_fail         — if stage fails, skip it and continue pipeline
#   loop                 — repeat stage up to {max} times (min..max range)
#   opt                  — stage is optional (required: false)
#
# Success condition types:
#   action_completed                  — action finished normally
#   posture_reached                   — dog reached target posture
#   distance_reached                  — dog reached target distance
#   orientation_achieved              — dog facing within bearing tolerance
#   duration_elapsed_or_food_consumed — ate for min time or food gone
#   elimination_completed             — full elimination cycle done
#   min_duration_elapsed              — minimum wall-clock time passed
#   posture_held                      — posture maintained for min time
#   sleep_cycle_completed             — one sleep cycle elapsed
#   charging_or_resting               — docked or lying down conserving
#   person_found                      — search found a visible person
#   observation_completed             — observed target for min time

