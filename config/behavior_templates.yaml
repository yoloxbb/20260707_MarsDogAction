            - {unit_id: ACT_LEAN_AGAINST_DOOR, weight: 0.7}
            - {unit_id: ACT_LIE_BY_DOOR, weight: 0.6}
            - {unit_id: ACT_SCRATCH_DOOR, weight: 0.5}
            - {unit_id: ACT_IGNORE_DOOR, weight: 0.3}
          # ── food_bowl ───────────────────────────────────────────────────
          food_bowl:
            - {unit_id: ACT_SNIFF_BOWL_EDGE, weight: 1.0}
            - {unit_id: ACT_PAW_AT_BOWL, weight: 0.8}
            - {unit_id: ACT_SIT_OR_LIE_BY_BOWL, weight: 0.6}
            - {unit_id: ACT_SCRATCH_FOOD_BOWL_OR_SNACK_CABINET, weight: 0.5}
            - {unit_id: ACT_GUARD_FOOD_BOWL_OR_SNACK_CABINET, weight: 0.4}
          # ── toy ─────────────────────────────────────────────────────────
          toy:
            - {unit_id: ACT_SNIFF_OBJECT, weight: 1.0}
            - {unit_id: ACT_TOUCH_OR_CARRY_OBJECT_WITH_MOUTH, weight: 0.8}
            - {unit_id: ACT_CARRY_AND_SHAKE_OBJECT, weight: 0.7}
            - {unit_id: ACT_CARRY_AND_DROP_OBJECT_AGAIN, weight: 0.6}
            - {unit_id: ACT_CARRY_AND_HIDE_OBJECT, weight: 0.5}
            - {unit_id: ACT_PUSH_OBJECT_WITH_PAW, weight: 0.6}
          # ── generic (fallback) ──────────────────────────────────────────
